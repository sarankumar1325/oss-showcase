# Refreshes the portfolio snapshot and deploys to GitHub Pages.
# No secrets to create: the built-in GITHUB_TOKEN is enough for public data.
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".
name: Deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 */6 * * *' # every 6 hours, so new merges land without a push
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - name: Generate snapshot from portfolio.config.ts
        run: bun run snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Render the link-preview card
        run: bun run og

      - id: pages
        uses: actions/configure-pages@v5

      - name: Build
        run: bun run build
        env:
          # project sites are served from /<repo>/; user sites and custom domains from /
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          # absolute URLs for link previews (og:image needs one)
          SITE_URL: ${{ steps.pages.outputs.base_url }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
